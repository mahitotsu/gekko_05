server {
    listen 3000;

    # Keycloak's browser-facing endpoints (authorization/token/logout pages, and its
    # static resources) are reverse-proxied under the same origin as the frontend, so
    # the browser only ever sees one origin -- mirroring a real CDN/API-gateway ingress
    # and giving the issuer a non-"localhost" host once combined with KC_HOSTNAME.
    # Note: $host strips the port number, but Keycloak's DPoP proof validation
    # (RFC 9449 `htu`) reconstructs its own request URI from the Host header and
    # compares it byte-for-byte against the client-supplied proof -- so a stripped
    # port here makes every DPoP-bound request fail with "DPoP HTTP URL mismatch",
    # even though $host is fine for plain (non-DPoP) requests. $http_host keeps it.
    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
    }

    # Grafana (grafana/otel-lgtm), for browsing OTel traces. Not part of the
    # Token Exchange demo's own auth flow (no DPoP/issuer-hostname constraints),
    # just proxied here to avoid opening a second host port for it.
    # proxy_pass with NO trailing slash/path here is deliberate: GF_SERVER_SERVE_FROM_SUB_PATH
    # expects the full /grafana/... path to reach it unchanged. A trailing slash on
    # proxy_pass (`http://otel-lgtm:3000/`) makes nginx strip the /grafana/ prefix
    # before forwarding, so Grafana never sees it -- it then keeps redirecting back
    # to its own configured root_url (/grafana/), an infinite 301 loop.
    location /grafana/ {
        proxy_pass http://otel-lgtm:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana's live-data features use WebSocket connections.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
