server {
    listen 3000;

    # Docker's embedded DNS (127.0.0.11) is what "keycloak"/"frontend"/"otel-lgtm"
    # actually resolve through on this user-defined network. A bare `proxy_pass
    # http://frontend:3000;` is parsed as a static upstream, so nginx resolves it once
    # at config load and caches that IP for the worker's lifetime -- if the target
    # container is later recreated alone (a new IP, same service name), nginx keeps
    # connecting to the stale IP and every request 502s until nginx itself restarts.
    # Routing proxy_pass through a variable instead forces a real per-request lookup
    # via this resolver, re-resolving every `valid` seconds -- so a recreated backend
    # container is picked up without needing to touch edge-proxy at all.
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Deliberately not OTel-instrumented: this is a pure CDN/API-gateway-style ingress
    # with no domain logic (services.md), not an authorization subject like the services
    # behind it. Tracing it would need nginx's otel module, which can only emit a SERVER
    # span for the inbound request -- it has no way to also mark the proxied upstream
    # call as CLIENT, so downstream services would still show as caller-less ("user") in
    # Tempo's service graph regardless (its client/server-pairing algorithm needs that
    # CLIENT span; see https://grafana.com/docs/tempo/latest/metrics-from-traces/service_graphs/).
    # Leaving edge-proxy untraced means frontend/Keycloak's own root spans correctly
    # show as called by "user" directly -- an accurate picture once edge-proxy is
    # treated as transparent infrastructure, not a half-measure needing a workaround.

    # Keycloak's browser-facing endpoints (authorization/token/logout pages, and its
    # static resources) are reverse-proxied under the same origin as the frontend, so
    # the browser only ever sees one origin -- mirroring a real CDN/API-gateway ingress
    # and giving the issuer a non-"localhost" host once combined with KC_HOSTNAME.
    # Note: $host strips the port number, but Keycloak's DPoP proof validation
    # (RFC 9449 `htu`) reconstructs its own request URI from the Host header and
    # compares it byte-for-byte against the client-supplied proof -- so a stripped
    # port here makes every DPoP-bound request fail with "DPoP HTTP URL mismatch",
    # even though $host is fine for plain (non-DPoP) requests. $http_host keeps it.
    location /realms/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080;
        proxy_set_header Host $http_host;
    }

    # Dedicated probe target for this container's own compose healthcheck: proxies
    # straight to Keycloak's readiness endpoint (management port, --health-enabled=true
    # in keycloak/Dockerfile) instead of reusing a business realm endpoint, so this
    # 5s-interval check verifies both that nginx can actually reach Keycloak and that
    # Keycloak itself reports ready -- not just that some business endpoint happens to
    # respond.
    location = /internal/keycloak-health {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:9000/health/ready;
        proxy_set_header Host $http_host;
    }

    # Grafana (grafana/otel-lgtm), for browsing OTel traces. Not part of the
    # Token Exchange demo's own auth flow (no DPoP/issuer-hostname constraints),
    # just proxied here to avoid opening a second host port for it.
    # proxy_pass with NO trailing slash/path here is deliberate: GF_SERVER_SERVE_FROM_SUB_PATH
    # expects the full /grafana/... path to reach it unchanged. A trailing slash on
    # proxy_pass (`http://otel-lgtm:3000/`) makes nginx strip the /grafana/ prefix
    # before forwarding, so Grafana never sees it -- it then keeps redirecting back
    # to its own configured root_url (/grafana/), an infinite 301 loop.
    location /grafana/ {
        set $otel_lgtm_upstream otel-lgtm;
        proxy_pass http://$otel_lgtm_upstream:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana's live-data features use WebSocket connections.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
