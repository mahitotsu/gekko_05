server {
    listen 3000;

    # このユーザー定義ネットワーク上で"keycloak"/"frontend"/"otel-lgtm"を実際に
    # 解決しているのはDockerの組み込みDNS(127.0.0.11)である。素の`proxy_pass
    # http://frontend:3000;`はstatic upstreamとして解釈され、nginxはconfig読み込み
    # 時に一度だけ名前解決してワーカーの生存期間中そのIPをキャッシュしてしまう
    # ——対象コンテナだけが後で再作成される（サービス名は同じでIPが変わる）と、
    # nginxは古いIPへ接続し続け、nginx自身が再起動するまで全リクエストが502に
    # なる。proxy_passを変数経由にすることで、このresolverを通じたリクエストごとの
    # 実際の名前解決を強制し、`valid`秒ごとに再解決させる——これにより、
    # edge-proxy自身に触れることなく、再作成されたバックエンドコンテナに追従できる
    # （詳細はdocs/insights.md）。
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # 意図的にOTel計装をしていない：これはドメインロジックを持たない純粋な
    # CDN/APIゲートウェイ型の入口であり（services.md）、背後のサービス群のような
    # 認可上の主体ではない。計装するにはnginxのotelモジュールが必要だが、これは
    # 受信リクエストのSERVERスパンしか生成できず、プロキシ先の呼び出しをCLIENTと
    # して示す手段が無い。そのためTempoのservice graph（CLIENT/SERVERのペアを
    # 要求するアルゴリズム）上では、計装してもしなくても下流サービスは呼び出し元
    # 不明("user")のままになる（参考：
    # https://grafana.com/docs/tempo/latest/metrics-from-traces/service_graphs/）。
    # edge-proxyを計装しないままにすることで、frontend/Keycloak自身のルートスパンが
    # 正しく「userから直接呼ばれた」と表示される——edge-proxyを透過的なインフラと
    # 割り切った結果としての正確な絵であり、中途半端な回避策を必要としない。

    # Keycloakのブラウザ向けエンドポイント（認可/トークン/ログアウト画面や静的
    # リソース）はfrontendと同一オリジン配下へリバースプロキシする。これにより
    # ブラウザから見えるオリジンは常に1つになり、実際のCDN/APIゲートウェイ型の
    # 入口を模しつつ、KC_HOSTNAMEと組み合わせてissuerを"localhost"感の無いホスト
    # にできる。
    # 注意：$hostはポート番号を取り除くが、KeycloakのDPoP Proof検証
    # （RFC 9449 `htu`）はHostヘッダーから自前でリクエストURIを再構築し、
    # クライアントが送ったProofとバイト単位で比較する——そのためここでポートが
    # 落ちると、DPoP-boundな全リクエストが"DPoP HTTP URL mismatch"で失敗する
    # （$hostのままでも非DPoPのリクエストは問題ない）。$http_hostならポートが
    # 保持される。
    location /realms/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:8080;
        proxy_set_header Host $http_host;
    }

    # このコンテナ自身のcomposeヘルスチェック専用のプローブ先：業務用のrealm
    # エンドポイントを間借りするのではなく、Keycloakのreadinessエンドポイント
    # （managementポート、keycloak/Dockerfileの--health-enabled=true）に直接
    # プロキシする。これにより5秒間隔のこのチェックは、nginxが実際にKeycloakへ
    # 到達できることと、Keycloak自身がreadyだと報告していることの両方を検証する
    # ——たまたま何らかの業務エンドポイントが応答した、というだけでは済まない。
    location = /internal/keycloak-health {
        set $keycloak_upstream keycloak;
        proxy_pass http://$keycloak_upstream:9000/health/ready;
        proxy_set_header Host $http_host;
    }

    # Grafana（grafana/otel-lgtm）：OTelトレースを閲覧するため。Token Exchangeデモ
    # 自体の認証フローの一部ではない（DPoP/issuerホスト名の制約は受けない）ので、
    # 単にホストの別ポートを開けずに済ませるためここでプロキシしているだけ。
    # proxy_passの末尾にスラッシュ/パスを付けないのは意図的：
    # GF_SERVER_SERVE_FROM_SUB_PATHは/grafana/...というフルパスがそのまま届くこと
    # を期待する。proxy_passの末尾にスラッシュを付けると（`http://otel-lgtm:3000/`）
    # nginxが転送前に/grafana/プレフィックスを取り除いてしまいGrafanaに届かず、
    # Grafana自身が設定されたroot_url(/grafana/)へリダイレクトし続ける無限301
    # ループになる。
    location /grafana/ {
        set $otel_lgtm_upstream otel-lgtm;
        proxy_pass http://$otel_lgtm_upstream:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafanaのライブデータ機能はWebSocket接続を使う。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
