server:
  port: 8081

spring:
  application:
    name: ${OTEL_SERVICE_NAME:order-service}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order-postgres}
    username: ${SPRING_DATASOURCE_USERNAME:order_service}
    password: ${SPRING_DATASOURCE_PASSWORD:order_service}
  jpa:
    hibernate:
      # スキーマの所有者はHibernateではなくdb/init.sql（postgresコンテナへ
      # マウントされる）。`validate`はエンティティのマッピングが実際のスキーマと
      # 一致するかを確認するだけで、テーブルの作成・変更は一切行わない。これに
      # より投入データ・マイグレーションを明示的かつSQLネイティブに保てる。
      ddl-auto: validate
    open-in-view: false

app:
  keycloak:
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8080/realms/kikan-system}
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/kikan-system}
  order-service:
    client-id: order-service
    client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
  inventory-service:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8082}

logging:
  structured:
    format:
      console: logstash

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # 他の4サービスと同じOTEL_EXPORTER_OTLP_ENDPOINT（パスを含まないベースURL）
      # 環境変数を使う——Spring自身のmanagement.otlp.tracing.endpointがたまたま
      # /v1/tracesまでのフルURLを要求するため、Spring専用の環境変数名を別途増やす
      # のではなく、ここでパスを付与している。
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
