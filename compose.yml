services:
  otel-lgtm:
    # Grafana + Tempo（トレース）+ Loki + Prometheus/Mimirが1つに統合された
    # オールインワンイメージ。ここではトレース（Tempo経由）のみを使う——メトリクス
    # 計装やダッシュボード構築は行わない。OTLPエンドポイントは1つ（4318番HTTP /
    # 4317番gRPC）で、追加設定は不要。
    image: grafana/otel-lgtm:latest
    # `docker compose ps`にこのコンテナの待受ポートを記録する（他サービスは
    # 自身のDockerfileのEXPOSEからこれを得ているのと揃える）——このイメージの
    # Dockerfileは EXPOSE を宣言していないため、これが無いと何も表示されない。
    # 純粋に情報表示用：ports:マッピングは無いので、ホストへは何も公開されない。
    expose:
      - "3000"
      - "3100"
      - "4317"
      - "4318"
    environment:
      # 自身のホストポートではなくedge-proxyの/grafana/パス配下で提供する。
      # ホストに開けるポートをedge-proxy経由の1つ（3000）だけに保つため。
      GF_SERVER_ROOT_URL: http://localhost:3000/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    healthcheck:
      # このイメージはwgetではなくcurlを同梱している（他サービスのベース
      # イメージとは異なる）。
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      otel-lgtm:
        condition: service_healthy

  keycloak:
    build: ./keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # issuerを固定し、クライアントがdocker内部のホスト名（他サービス）経由で
      # Keycloakへ到達する場合とedge-proxy（ホストマシン、ブラウザ）経由で到達
      # する場合とで同じ値になるようにする。これが無いとKeycloakは接続してきた
      # リクエストのHostヘッダーからissuerを動的に算出するため、一方の経路で
      # 発行されたトークンをもう一方の経路で提示すると"Invalid token"として拒否
      # される（例：Token Exchangeのsubject_token検証時）。Keycloakはもはやホスト
      # へ直接公開されておらず、edge-proxyが唯一の公開入口である
      # （architecture.md §17参照）。
      KC_HOSTNAME: http://localhost:3000
      # 他サービスのOTEL_SERVICE_NAME / OTEL_EXPORTER_OTLP_ENDPOINTのペアと同じ扱い
      # （ビルドステップではなく実行時環境変数にしている理由はkeycloak/Dockerfile
      # 参照）。KC_TRACING_ENDPOINTは既定でgRPCの:4317番を指す。otel-lgtmは
      # :4318番のHTTPエンドポイントと並んでこれも公開している。
      KC_TRACING_ENABLED: "true"
      KC_TRACING_SERVICE_NAME: keycloak
      KC_TRACING_ENDPOINT: http://otel-lgtm:4317
      # 別のmanagementポート（既定9000番）で/health/ready等を公開する。以下と
      # edge-proxyの/internal/keycloak-healthはこれを使い、ヘルスチェックのために
      # realmエンドポイントを間借りしない——realmエンドポイントと異なり、この
      # ポートへのリクエストは自動的にトレース対象から除外される（Quarkusの
      # quarkus.otel.traces.suppress-non-application-uris、既定で有効、自身の
      # health/metricsエンドポイントをカバーする。managementインターフェースの
      # 有効化がこの抑制を無効化してしまう過去のバグはQuarkus 3.15.4で修正済みで、
      # このKeycloakバージョンが同梱する3.27.1より十分古い——実機で確認済み）。
      KC_HEALTH_ENABLED: "true"
      # jboss-logging event listenerの成功イベントの既定ログレベルはDEBUGで、
      # 既定のINFOルートログレベルでは見えない——実機で確認済み：これを未設定の
      # ままだとLOGIN/TOKEN_EXCHANGEの成功イベントは`docker logs`に一切現れず、
      # 一方*_ERRORイベント（WARNで出力）は現れた。エラーレベルは既定で既に
      # WARNなので、ここでは成功レベルのみ引き上げれば足りる。
      KC_SPI_EVENTS_LISTENER_JBOSS_LOGGING_SUCCESS_LEVEL: "info"
    depends_on:
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      # このイメージにcurl/wgetは無いが、bashは使えるので/dev/tcp機能を使う。
      # /health/ready（managementポート9000番、Dockerfileの--health-enabled=true
      # 由来）はreadinessを報告する——--import-realmの完了も含む。これは
      # Quarkusがアプリをready扱いにする前の起動処理の一部として実行されるため。
      # 旧来の/realms/master/...チェックのようにrealmエンドポイントを間借り
      # しない。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          head -1 <&3 | grep -q 200
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  order-postgres:
    image: postgres:16
    environment:
      # DB名はorder_service（POSTGRES_USER/PASSWORD、つまり認証情報としてのみ
      # 残しており、表示名ではない）ではなく、このcomposeサービス自身の名前に
      # 合わせている——JDBCのdb.namespaceスパン属性（order-serviceの
      # datasource-micrometer-spring-bootが報告する値。任意の属性を明示設定できる
      # inventory-service/warehouse-serviceとは異なる）が、Tempoのservice graph上で
      # order-serviceアプリ自身と紛らわしいノードとして表示されるのを避けるため。
      POSTGRES_DB: order-postgres
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_service
    volumes:
      - ./order-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_service"]
      interval: 5s
      timeout: 5s
      retries: 12

  order-service:
    build: ./order-service
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/kikan-system
      KEYCLOAK_ISSUER: http://localhost:3000/realms/kikan-system
      ORDER_SERVICE_CLIENT_SECRET: order-service-secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-postgres:5432/order-postgres
      SPRING_DATASOURCE_USERNAME: order_service
      SPRING_DATASOURCE_PASSWORD: order_service
      INVENTORY_SERVICE_BASE_URL: http://inventory-service:8082
      OTEL_SERVICE_NAME: order-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      keycloak:
        condition: service_healthy
      order-postgres:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  inventory-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory_service
      MYSQL_USER: inventory_service
      MYSQL_PASSWORD: inventory_service
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./inventory-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "inventory_service", "-pinventory_service"]
      interval: 5s
      timeout: 5s
      retries: 12

  inventory-service:
    build: ./inventory-service
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/kikan-system
      KEYCLOAK_ISSUER: http://localhost:3000/realms/kikan-system
      INVENTORY_SERVICE_CLIENT_SECRET: inventory-service-secret
      MYSQL_DSN: inventory_service:inventory_service@tcp(inventory-mysql:3306)/inventory_service
      WAREHOUSE_SERVICE_BASE_URL: http://warehouse-service:8083
      OTEL_SERVICE_NAME: inventory-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      keycloak:
        condition: service_healthy
      inventory-mysql:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  warehouse-redis:
    build: ./warehouse-service/db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  warehouse-service:
    build: ./warehouse-service
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/kikan-system
      KEYCLOAK_ISSUER: http://localhost:3000/realms/kikan-system
      WAREHOUSE_SERVICE_CLIENT_SECRET: warehouse-service-secret
      REDIS_URL: redis://warehouse-redis:6379
      EMPLOYEE_SERVICE_BASE_URL: http://employee-service:8084
      OTEL_SERVICE_NAME: warehouse-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      keycloak:
        condition: service_healthy
      warehouse-redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  employee-mongo:
    image: mongo:7
    volumes:
      - ./employee-service/db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12

  employee-service:
    build: ./employee-service
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/kikan-system
      KEYCLOAK_ISSUER: http://localhost:3000/realms/kikan-system
      MONGO_URI: mongodb://employee-mongo:27017
      OTEL_SERVICE_NAME: employee-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      keycloak:
        condition: service_healthy
      employee-mongo:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      # Nitro（Nuxtのサーバーエンジン）は起動時、NUXT_<KEY>形式の環境変数からしか
      # runtimeConfigの項目を上書きしない——nuxt.config.ts参照。
      NUXT_KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/kikan-system
      NUXT_KEYCLOAK_PUBLIC_URL: http://localhost:3000/realms/kikan-system
      NUXT_FRONTEND_CLIENT_SECRET: frontend-secret
      NUXT_PUBLIC_ORIGIN: http://localhost:3000
      NUXT_ORDER_SERVICE_BASE_URL: http://order-service:8081
      NUXT_EMPLOYEE_SERVICE_BASE_URL: http://employee-service:8084
      NUXT_SESSION_SECRET: dev-only-insecure-secret-change-me
      OTEL_SERVICE_NAME: frontend
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    depends_on:
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      # /api/meはapp.vue自身のセッション確認からも実際に叩かれるため、ここでは
      # X-Health-Checkを付けてotel.mjsのignoreIncomingRequestHookで除外している
      # ——そうしないとこの5秒間隔のプローブがservice graphをノイズで
      # 埋め尽くしてしまう。
      test: ["CMD", "wget", "-q", "-O", "-", "--header=X-Health-Check: 1", "http://localhost:3000/api/me"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  edge-proxy:
    build: ./edge-proxy
    ports:
      - "3000:3000"
    depends_on:
      frontend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      # localhostではなく127.0.0.1を使う：nginxの`listen 3000;`はIPv4のみで
      # bindしているが、このコンテナの/etc/hostsは"localhost"をまず::1
      # （IPv6）で解決し、wgetはそちらを試みて拒否されてからでないとIPv4へ
      # フォールバックしないため。
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/internal/keycloak-health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # シナリオ実行: docker compose --profile audit run --rm scenario
  scenario:
    profiles: [audit]
    build: ./audit
    command: ["python3", "scenario.py"]
    environment:
      FRONTEND_URL: http://edge-proxy:3000
    depends_on:
      edge-proxy:
        condition: service_healthy

  # 監査実行: docker compose --profile audit run --rm audit
  audit:
    profiles: [audit]
    build: ./audit
    environment:
      LOKI_URL: http://otel-lgtm:3100
      # 監査対象期間（秒）。デフォルト 1 時間。
      AUDIT_WINDOW_SECONDS: "3600"
    depends_on:
      otel-lgtm:
        condition: service_healthy
