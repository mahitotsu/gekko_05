[package]
name = "warehouse-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# --- OpenTelemetry distributed tracing (OTLP/HTTP export, W3C traceparent) ---
# "hyper-client" (not "reqwest-*"): opentelemetry-otlp 0.32 requires reqwest 0.13
# for its own reqwest-based client features, but reqwest 0.13's rustls integration
# is aws-lc-rs only (needs cmake, unlike 0.12's ring-based rustls-tls this project
# already relies on for its own outbound calls -- see reqwest dep above). Using
# opentelemetry-http's hyper-based client instead avoids that forced reqwest bump
# entirely, so the app keeps TLS capability via reqwest 0.12 without adding cmake
# to the musl/alpine Docker build.
opentelemetry = "0.32"
# rt-tokio: the default (non-async-runtime) BatchSpanProcessor exports spans from
# a plain OS thread with no Tokio context, which panics ("no reactor running")
# against the hyper-based OTLP client above -- hyper needs an async runtime to
# poll its futures. rt-tokio provides the Tokio-integrated BatchSpanProcessor used
# in main.rs instead.
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "hyper-client"] }
opentelemetry-http = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
# tracing_level_info: axum-tracing-opentelemetry creates its per-request spans at
# TRACE level by default (target "otel::tracing"), which RUST_LOG=info (set in the
# Dockerfile) filters out entirely -- every request then fails to attach a parent
# trace_id ("SpanDisabled") because the span was never actually created. This
# feature makes it create spans at INFO instead, matching RUST_LOG=info.
axum-tracing-opentelemetry = { version = "0.39", features = ["tracing_level_info"] }
