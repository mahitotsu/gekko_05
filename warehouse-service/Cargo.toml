[package]
name = "warehouse-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# --- OpenTelemetry分散トレーシング（OTLP/HTTPエクスポート、W3C traceparent） ---
# "reqwest-*"ではなく"hyper-client"を使う：opentelemetry-otlp 0.32は自身の
# reqwestベースクライアント機能にreqwest 0.13を要求するが、0.13のrustls統合は
# aws-lc-rs必須（cmakeが要る）。本プロジェクトが自身の発信呼び出しで既に使って
# いる0.12のring版rustls-tls（上のreqwest依存を参照）とは事情が異なる。代わりに
# opentelemetry-httpのhyperベースクライアントを使うことで、このreqwestバージョン
# 強制アップを完全に避けられる。アプリはreqwest 0.12のままTLS機能を保ち、
# musl/alpineのDockerビルドにcmakeを持ち込まずに済む（詳細はdocs/insights.md）。
opentelemetry = "0.32"
# rt-tokio：既定（非同期ランタイム非統合）のBatchSpanProcessorは、Tokioの
# コンテキストを持たない素のOSスレッドからスパンをエクスポートするため、上記の
# hyperベースOTLPクライアントに対しては「no reactor running」でパニックする
# ——hyperはfutureをpollするために非同期ランタイムを必要とする。rt-tokioは
# main.rsで使っているTokio統合版のBatchSpanProcessorを提供する。
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "hyper-client"] }
opentelemetry-http = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
# tracing_level_info：axum-tracing-opentelemetryは既定でリクエストごとのスパンを
# TRACEレベル（target "otel::tracing"）で生成するが、これはDockerfileで設定した
# RUST_LOG=infoに完全にフィルタされてしまう——スパン自体が生成されないため、
# 全リクエストで親trace_idの付与に失敗する（"SpanDisabled"）。このフィーチャーに
# より、RUST_LOG=infoに合わせてINFOレベルでスパンを生成するようになる。
axum-tracing-opentelemetry = { version = "0.39", features = ["tracing_level_info"] }
